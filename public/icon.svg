<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Shield Shape (Dapodik Brand Theme) -->
  <g filter="url(#glow)">
    <path d="M256,80 C340,80 390,110 410,180 C410,290 340,380 256,432 C172,380 102,290 102,180 C122,110 172,80 256,80 Z" fill="url(#shieldGrad)" />
  </g>

  <!-- Golden Stars & Laurel Wreath Accents -->
  <path d="M256,120 L264,138 L283,141 L269,155 L272,174 L256,165 L240,174 L243,155 L229,141 L248,138 Z" fill="url(#goldGrad)" />
  <path d="M190,140 L196,153 L211,155 L200,165 L203,180 L190,173 L177,180 L180,165 L169,155 L184,153 Z" fill="url(#goldGrad)" opacity="0.8" />
  <path d="M322,140 L328,153 L343,155 L332,165 L335,180 L322,173 L309,180 L312,165 L301,155 L316,153 Z" fill="url(#goldGrad)" opacity="0.8" />

  <!-- Integrated Database Rings / Education Book -->
  <g transform="translate(256, 270) scale(1.1)">
    <!-- Book Pages -->
    <path d="M-80,20 C-40,-10 0,10 0,10 C0,10 40,-10 80,20 L80,-40 C40,-70 0,-50 0,-50 C0,-50 -40,-70 -80,-40 Z" fill="#ffffff" />
    
    <!-- Database Rings inside Book center -->
    <!-- Base Cylinders inside education theme -->
    <path d="M-40,-10 C-40,-20 40,-20 40,-10 C40,0 -40,0 -40,-10 Z" fill="url(#goldGrad)" />
    <path d="M-40,5 C-40,-5 40,-5 40,5 C40,15 -40,15 -40,5 Z" fill="url(#goldGrad)" />
    <path d="M-40,20 C-40,10 40,10 40,20 C40,30 -40,30 -40,20 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Glowing Outer Frame border -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="#38bdf8" stroke-width="8" opacity="0.2" />
</svg>
